<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Электрический двигатель — якорь (3D)</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14161c;
    color: #e6e9ef;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    user-select: none;
  }
  .hud h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.4px;
    color: #cfd6e4;
  }
  .hud p {
    margin: 0;
    font-size: 13px;
    color: #7f879a;
  }

  .controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .settings {
    position: fixed;
    right: 18px;
    top: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
    background: rgba(18, 20, 26, 0.72);
    border: 1px solid #2a3040;
    border-radius: 12px;
    padding: 14px;
    z-index: 10;
    backdrop-filter: blur(4px);
  }
  .settings-title {
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #7f879a;
    margin-bottom: 2px;
  }
  .settings button {
    width: 100%;
    white-space: normal;
    line-height: 1.25;
  }
  .section-title {
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px solid #262c3a;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #cfd6e4;
  }
  
  .range {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    color: #9aa3b5;
  }
  .checkbox {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #9aa3b5;
    cursor: pointer;
  }
  .checkbox input { width: 15px; height: 15px; }
  input[type="range"] { width: 130px; }
  #distNumsVal, #speedAnimVal { min-width: 24px; text-align: right; color: #dfe4ee; }
  button {
    background: #232733;
    color: #dfe4ee;
    border: 1px solid #333949;
    border-radius: 9px;
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #2c3342; border-color: #46506a; }

  .legend {
    position: fixed;
    left: 18px;
    bottom: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    color: #9aa3b5;
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <h1>Электрический двигатель — якорь</h1>
  <p>Зажмите левую кнопку мыши, чтобы вращать · колесо — приблизить · правая кнопка — сдвинуть</p>
  <p>Кликните по проводу, чтобы выделить его и проследить путь обмотки</p>
</div>

<div class="legend">
  <span><i class="dot" style="background:#c9ced8"></i>Вал</span>
  <span><i class="dot" style="background:#8b93a3"></i>Якорь</span>
  <span><i class="dot" style="background:#d98b3a"></i>Коллектор</span>
</div>

<div class="controls">
  <button id="btnRotate">▶ Запустить анимацию</button>
  <label class="range">Скорость вращения
    <input id="speedAnim" type="range" min="0.1" max="3" step="0.1" value="0.6">
    <span id="speedAnimVal">0.6</span>
  </label>
  <button id="btnReset">Сбросить вид</button>
</div>

<div class="settings">
  <div class="settings-title">Настройки якоря</div>

  <div class="section-title">Коллектор</div>
  <label class="checkbox">
    <input id="chkNums" type="checkbox" checked>
    Номера ламелей
  </label>
  <label class="range">Расстояние цифр
    <input id="distNums" type="range" min="10" max="120" step="2" value="32">
    <span id="distNumsVal">32</span>
  </label>

  <div class="section-title">Прочее</div>
  <button id="btnReverse">Изменить направление вращения</button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
